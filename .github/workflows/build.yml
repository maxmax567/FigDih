name: Build Releases

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ============ WINDOWS ============
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            client
      - name: Build server
        working-directory: server
        run: cargo build --release
      - name: Build client
        working-directory: client
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item server/target/release/figdih-server.exe dist/
          Copy-Item client/target/release/figdih-client.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: FigDih-Windows
          path: dist/

  # ============ LINUX + APPIMAGE ============
  build-linux:
    runs-on: ubuntu-22.04   # glibc 2.35 → compatible con distros 2022+
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            client

      - name: Dependencias de GUI (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Build server
        working-directory: server
        run: cargo build --release
      - name: Build client
        working-directory: client
        run: cargo build --release

      - name: Binarios Linux sueltos (tar.gz)
        run: |
          mkdir -p dist-linux
          cp server/target/release/figdih-server dist-linux/
          cp client/target/release/figdih-client dist-linux/
          tar czf FigDih-Linux-x86_64.tar.gz -C dist-linux .

      - name: Construir AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp client/target/release/figdih-client AppDir/usr/bin/
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/figdih-client" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/figdih.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=FigDih
          Comment=Chat ultraligero en Rust
          Exec=figdih-client
          Icon=figdih
          Categories=Network;InstantMessaging;
          EOF
          convert -size 256x256 gradient:'#5865F2'-'#3b44b8' -fill white \
            -gravity center -pointsize 150 -annotate +0+0 'F' AppDir/figdih.png
          cp AppDir/figdih.png AppDir/.DirIcon
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          ./squashfs-root/AppRun AppDir FigDih-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: FigDih-Linux
          path: |
            FigDih-x86_64.AppImage
            FigDih-Linux-x86_64.tar.gz
