name: Server Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del servidor (ej: 3.1.0). Vacío = fecha.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"; else V="$(date +%Y.%m.%d-%H%M)"; fi
          echo "version=$V" >> $GITHUB_OUTPUT

  docker:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/figdih:latest
            ghcr.io/${{ github.repository_owner }}/figdih:${{ needs.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build
        working-directory: server
        run: cargo build --release

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cp server/target/release/figdih-server out/
          tar czf figdih-server-linux-x86_64.tar.gz -C out .

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path server/target/release/figdih-server.exe -DestinationPath figdih-server-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ runner.os }}
          path: figdih-server-*

  publish:
    needs: [meta, docker, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Aplanar archivos
        run: |
          mkdir -p rel
          find dl -type f -exec cp {} rel/ \;
          ls -lh rel/

      - name: Notas
        run: |
          cat > NOTES.md << 'EOF'
          ## 🖥️ FigDih Server ${{ needs.meta.outputs.version }}

          ### Docker (recomendado)
          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/figdih:${{ needs.meta.outputs.version }}
          docker compose pull && docker compose up -d
          ```

          ### Binarios
          - `figdih-server-linux-x86_64.tar.gz`
          - `figdih-server-windows-x86_64.zip`

          ⚠️ Tras actualizar el servidor, copia la nueva URL del túnel y lanza **App Release** con ella.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: server-v${{ needs.meta.outputs.version }}
          name: "🖥️ Server ${{ needs.meta.outputs.version }}"
          body_path: NOTES.md
          files: rel/*