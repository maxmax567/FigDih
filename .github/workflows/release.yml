name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej: v0.4.0). Deja vacío para usar fecha.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  # ==================== WINDOWS (solo server) ====================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - name: Build server
        working-directory: server
        run: cargo build --release
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item server/target/release/figdih-server.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: dist/figdih-server.exe

  # ==================== LINUX (AppImage + tar.gz) ====================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            client

      - name: Dependencias GUI + notificaciones
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev

      - name: Build server y cliente
        run: |
          cd server && cargo build --release && cd ..
          cd client && cargo build --release && cd ..

      - name: tar.gz (server + client)
        run: |
          mkdir -p dist-linux
          cp server/target/release/figdih-server dist-linux/
          cp client/target/release/figdih-client dist-linux/
          tar czf FigDih-Linux-x86_64.tar.gz -C dist-linux .

      - name: AppImage (todo en uno)
        run: |
          mkdir -p AppDir/usr/bin
          cp client/target/release/figdih-client AppDir/usr/bin/
          cp server/target/release/figdih-server AppDir/usr/bin/
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          case "$1" in
            --server) exec "$HERE/usr/bin/figdih-server" ;;
            --both)   "$HERE/usr/bin/figdih-server" & exec "$HERE/usr/bin/figdih-client" ;;
            *)        exec "$HERE/usr/bin/figdih-client" "$@" ;;
          esac
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/figdih.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=FigDih
          Comment=Chat ultraligero en Rust
          Exec=figdih-client
          Icon=figdih
          Categories=Network;InstantMessaging;
          EOF
          convert -size 256x256 gradient:'#5865F2'-'#3b44b8' \
            -fill white -stroke none \
            -draw "roundrectangle 48,56 208,168 28,28" \
            -draw "polygon 88,160 88,204 132,168" \
            AppDir/figdih.png
          cp AppDir/figdih.png AppDir/.DirIcon
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          ./squashfs-root/AppRun AppDir FigDih-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: FigDih-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: FigDih-Linux-x86_64.tar.gz

  # ==================== DOCKER (solo server) ====================
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/figdih
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== PUBLICAR RELEASE ====================
  publish:
    needs: [build-windows, build-linux, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true

      - name: Determinar versión
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "v=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "v=v$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Generar notas
        run: |
          cat > RELEASE.md << EOF
          ## FigDih ${{ steps.version.outputs.v }}

          ### 🐧 Linux
          - \`FigDih-x86_64.AppImage\` → Doble clic para abrir (todo en uno: \`--server\` para hosting, \`--both\` para probar)
          - \`FigDih-Linux-x86_64.tar.gz\` → Server + cliente sueltos

          ### 🪟 Windows
          - \`figdih-server.exe\` → Servidor (hosting). El cliente de Windows se compila con \`cargo build --release\` o se usa la AppImage en WSL.

          ### 🐳 Docker
          \`\`\`bash
          docker pull ghcr.io/maxmax567/figdih:latest
          \`\`\`

          ---
          Build automático desde commit \`${{ github.sha }}\`
          EOF

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.v }}
          name: "FigDih ${{ steps.version.outputs.v }}"
          body_path: RELEASE.md
          draft: false
          prerelease: false
          files: |
            FigDih-x86_64.AppImage
            FigDih-Linux-x86_64.tar.gz
            figdih-server.exe