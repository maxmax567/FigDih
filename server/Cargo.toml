[package]
name = "figdih-server"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
futures-util = "0.3"
tokio-rusqlite = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }  # ← LA CLAVE

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true