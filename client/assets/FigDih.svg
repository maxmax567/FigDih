<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2BC9F6"/>
      <stop offset="0.55" stop-color="#5A7DF2"/>
      <stop offset="1" stop-color="#7A3CF0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B2A6B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Burbuja de chat -->
  <g filter="url(#soft)">
    <rect x="212" y="168" width="600" height="432" rx="150" fill="#FFFFFF"/>
    <path d="M 320 555 Q 306 640 286 702 Q 392 652 478 598 Z" fill="#FFFFFF"/>
  </g>

  <!-- Indicador "escribiendo..." -->
  <circle cx="407" cy="384" r="36" fill="#2BD4F8"/>
  <circle cx="512" cy="384" r="36" fill="#2BD4F8"/>
  <circle cx="617" cy="384" r="36" fill="#2BD4F8"/>

  <!-- Nombre -->
  <text x="512" y="845" text-anchor="middle" fill="#FFFFFF"
        font-family="Nunito, 'Segoe UI', Verdana, sans-serif"
        font-size="215" font-weight="800" letter-spacing="-4">FigDih</text>
</svg>