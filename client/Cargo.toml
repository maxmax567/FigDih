[package]
name = "figdih-client"
version = "0.3.1"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
tokio-tungstenite = "0.21"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true